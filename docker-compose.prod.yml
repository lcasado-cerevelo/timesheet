# PRODUCCIÓN de Tiempo en un servidor con Docker (por ejemplo una instancia pequeña de AWS EC2).
#   cp .env.prod.example .env.prod      # y rellena los valores marcados CAMBIAR
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# Solo Caddy publica puertos (80 y 443). La aplicación y la base de datos no son alcanzables desde internet.
# Si usas una base externa (RDS u otra), borra el servicio "db" y pon DB_HOST en .env.prod.

name: tiempo-prod

x-app: &app
  build:
    context: ./server
    dockerfile: Dockerfile.prod
  image: tiempo-app:prod
  restart: unless-stopped
  env_file: .env.prod
  environment: &app-env
    APP_ENV: production
    APP_DEBUG: "false"
    DB_CONNECTION: mariadb
    DB_HOST: ${DB_HOST:-db}
    DB_PORT: ${DB_PORT:-3306}
    SESSION_DRIVER: file
    CACHE_STORE: file
    QUEUE_CONNECTION: sync
  volumes:
    - tiempo-storage:/var/www/html/storage   # logos, PDF de facturas y registros: sobreviven a las actualizaciones

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN:?falta DOMAIN en .env.prod}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data                      # certificados de Let's Encrypt (no borrar)
      - caddy_config:/config
    depends_on:
      - app

  app:
    <<: *app
    environment:
      <<: *app-env
      WAIT_FOR_DB: "1"
      AUTO_MIGRATE: "1"
    expose:
      - "80"
    depends_on:
      db:
        condition: service_healthy

  # Mismo papel que el cron: avisos de "la hoja cambió" y recordatorios. Además se puede disparar desde fuera: POST /api/cron/run
  scheduler:
    <<: *app
    command: php artisan schedule:work
    environment:
      <<: *app-env
      WAIT_FOR_DB: "1"
    depends_on:
      - app

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:?falta DB_DATABASE}
      MARIADB_USER: ${DB_USERNAME:?falta DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?falta DB_ROOT_PASSWORD}
    volumes:
      - tiempo-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  tiempo-db:
  tiempo-storage:
  caddy_data:
  caddy_config:
